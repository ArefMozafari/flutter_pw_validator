name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  password_rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/password_rules
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  flutter_pw_validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run
