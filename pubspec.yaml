name: flutter_pw_validator
description: >-
  Live password rules under any TextField: a progress bar and a checklist of
  the rules still unmet, with Unicode-aware counting and rules you can reuse
  in forms.
version: 2.0.0
repository: https://github.com/ArefMozafari/flutter_pw_validator
issue_tracker: https://github.com/ArefMozafari/flutter_pw_validator/issues
topics:
  - password
  - validation
  - form
  - widget
  - ui
screenshots:
  - description: The validator under a password field, before and after typing.
    path: screenshots/validator.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  password_rules: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
